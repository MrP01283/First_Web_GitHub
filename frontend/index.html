<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>First Web App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 760px;
            margin: 32px auto;
            padding: 0 16px;
            line-height: 1.5;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            margin-top: 8px;
            padding: 10px;
            resize: vertical;
        }

        button,
        input {
            margin-top: 10px;
            padding: 8px 12px;
        }

        input[type="number"] {
            width: 110px;
        }

        input[type="range"] {
            width: 100%;
            padding: 0;
        }

        .summary-tools {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .limit-controls {
            margin-top: 10px;
        }

        .mode-controls {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .mode-controls label {
            display: inline-flex;
            gap: 6px;
            align-items: center;
        }

        .mode-controls input {
            margin-top: 0;
            padding: 0;
        }

        .counter {
            margin: 4px 0 0;
            color: #666;
            font-size: 14px;
        }

        .summary-button.loading {
            background: #888;
            color: white;
            cursor: not-allowed;
            opacity: 0.8;
        }

        .loading-indicator {
            display: none;
            margin-top: 10px;
            color: #555;
        }

        .loading-indicator.active {
            display: inline-flex;
            gap: 8px;
            align-items: center;
        }

        .hidden {
            display: none;
        }

        .page-header,
        .history-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .history-item {
            margin-top: 16px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .history-meta {
            color: #666;
            font-size: 14px;
        }

        .history-text {
            white-space: pre-wrap;
        }

        .danger-button {
            background: #c62828;
            color: white;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #ccc;
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div id="mainView">
        <div class="page-header">
            <h1>Приветствие</h1>
            <button onclick="showHistory()">История</button>
        </div>

        <input id="nameInput" type="text" placeholder="Введите имя">
        <button onclick="sendName()">Отправить</button>

        <p id="result"></p>

        <h1>AI-сокращение текста</h1>

        <textarea id="summaryInput" rows="8" placeholder="Вставьте большой текст, а AI выделит главное"></textarea>
        <p id="inputCounter" class="counter">0 символов, 0 слов</p>

        <div class="summary-tools">
            <input id="limitValue" type="number" min="1" value="1">
            <button id="summaryButton" class="summary-button" onclick="sendSummary()">Сократить</button>
            <button onclick="clearSummary()">Очистить</button>
        </div>

        <div class="limit-controls">
            <input id="limitRange" type="range" min="1" max="1" value="1">
        </div>

        <div class="mode-controls">
            <label>
                <input type="radio" name="summaryMode" value="precise" checked>
                Точная
            </label>
            <label>
                <input type="radio" name="summaryMode" value="fast">
                Быстрая
            </label>
        </div>

        <div id="summaryLoading" class="loading-indicator">
            <span class="spinner"></span>
            <span>AI сокращает текст...</span>
        </div>

        <p id="summaryResult"></p>
        <p id="outputCounter" class="counter">0 символов, 0 слов в результате</p>
        <p id="debugTail" class="counter"></p>
    </div>

    <div id="historyView" class="hidden">
        <div class="page-header">
            <h1>История сокращений</h1>
            <div class="history-actions">
                <button onclick="showMain()">Назад</button>
                <button class="danger-button" onclick="clearHistory()">Очистить историю</button>
            </div>
        </div>
        <p id="historyStatus" class="counter"></p>
        <div id="historyList"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const summaryInput = document.getElementById("summaryInput");
        const inputCounter = document.getElementById("inputCounter");
        const outputCounter = document.getElementById("outputCounter");
        const limitValue = document.getElementById("limitValue");
        const limitRange = document.getElementById("limitRange");
        const mainView = document.getElementById("mainView");
        const historyView = document.getElementById("historyView");
        const historyStatus = document.getElementById("historyStatus");
        const historyList = document.getElementById("historyList");

        summaryInput.addEventListener("input", updateInputStats);
        limitValue.addEventListener("input", syncRangeFromInput);
        limitRange.addEventListener("input", syncInputFromRange);

        function countWords(text) {
            const words = text.match(/[\p{L}\p{N}]+(?:[-'][\p{L}\p{N}]+)*/gu);
            return words ? words.length : 0;
        }

        function updateInputStats() {
            inputCounter.textContent = `${summaryInput.value.length} символов, ${countWords(summaryInput.value)} слов`;
            updateLimitControls();
        }

        function updateOutputCounter(text) {
            outputCounter.textContent = `${text.length} символов, ${countWords(text)} слов в результате`;
        }

        function getCurrentLimitMax() {
            return countWords(summaryInput.value);
        }

        function getCurrentLimitMin() {
            return 1;
        }

        function updateLimitControls() {
            const min = getCurrentLimitMin();
            const max = Math.max(min, getCurrentLimitMax());
            const currentValue = Number(limitValue.value) || min;
            const nextValue = Math.min(Math.max(currentValue, min), max);

            limitValue.min = min;
            limitValue.max = max;
            limitValue.value = nextValue;

            limitRange.min = min;
            limitRange.max = max;
            limitRange.value = nextValue;
        }

        function syncRangeFromInput() {
            const min = getCurrentLimitMin();
            const max = Number(limitValue.max);
            const value = Number(limitValue.value) || min;

            limitRange.value = Math.min(Math.max(value, min), max);
        }

        function syncInputFromRange() {
            limitValue.value = limitRange.value;
        }

        function renderMarkdown(text) {
            const safeText = text
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");

            return marked.parse(safeText);
        }

        function setSummaryLoading(isLoading) {
            const summaryButton = document.getElementById("summaryButton");
            const summaryLoading = document.getElementById("summaryLoading");

            summaryButton.disabled = isLoading;
            summaryButton.classList.toggle("loading", isLoading);
            summaryLoading.classList.toggle("active", isLoading);
        }

        function showMain() {
            historyView.classList.add("hidden");
            mainView.classList.remove("hidden");
        }

        async function showHistory() {
            mainView.classList.add("hidden");
            historyView.classList.remove("hidden");
            await loadHistory();
        }

        function formatDate(value) {
            return new Date(value).toLocaleString("ru-RU");
        }

        function getModeText(mode) {
            return mode === "fast" ? "Быстрая" : "Точная";
        }

        function renderHistory(items) {
            historyList.innerHTML = "";

            if (items.length === 0) {
                historyStatus.textContent = "История пустая";
                return;
            }

            historyStatus.textContent = "";

            items.forEach((item) => {
                const card = document.createElement("div");
                card.className = "history-item";

                const meta = document.createElement("p");
                meta.className = "history-meta";
                meta.textContent = `${formatDate(item.created_at)} | ${getModeText(item.mode)} | лимит: ${item.limit_value} слов | было: ${item.source_words}, стало: ${item.result_words}`;

                const sourceTitle = document.createElement("strong");
                sourceTitle.textContent = "Исходный текст";

                const source = document.createElement("p");
                source.className = "history-text";
                source.textContent = item.source_text;

                const resultTitle = document.createElement("strong");
                resultTitle.textContent = item.status === "success" ? "Сокращение" : "Ошибка";

                const result = document.createElement("p");
                result.className = "history-text";
                result.textContent = item.status === "success" ? item.result_text : item.error_text;

                const deleteButton = document.createElement("button");
                deleteButton.className = "danger-button";
                deleteButton.textContent = "Удалить";
                deleteButton.addEventListener("click", () => deleteHistoryItem(item.id));

                card.append(meta, sourceTitle, source, resultTitle, result, deleteButton);
                historyList.appendChild(card);
            });
        }

        async function loadHistory() {
            historyStatus.textContent = "Загрузка истории...";
            historyList.innerHTML = "";

            try {
                const response = await fetch("/history");
                const data = await response.json();

                if (!response.ok) {
                    historyStatus.textContent = data.detail || "Не удалось загрузить историю";
                    return;
                }

                renderHistory(data.items || []);
            } catch (error) {
                historyStatus.textContent = "Ошибка соединения";
            }
        }

        async function deleteHistoryItem(id) {
            try {
                const response = await fetch(`/history/${id}`, {
                    method: "DELETE"
                });

                if (!response.ok) {
                    historyStatus.textContent = "Не удалось удалить запись";
                    return;
                }

                await loadHistory();
            } catch (error) {
                historyStatus.textContent = "Ошибка соединения";
            }
        }

        async function clearHistory() {
            try {
                const response = await fetch("/history", {
                    method: "DELETE"
                });

                if (!response.ok) {
                    historyStatus.textContent = "Не удалось очистить историю";
                    return;
                }

                await loadHistory();
            } catch (error) {
                historyStatus.textContent = "Ошибка соединения";
            }
        }

        function clearSummary() {
            const summaryResult = document.getElementById("summaryResult");
            const debugTail = document.getElementById("debugTail");

            summaryInput.value = "";
            summaryResult.innerHTML = "";
            debugTail.textContent = "";
            updateInputStats();
            updateOutputCounter("");
        }

        async function sendName() {
            const name = document.getElementById("nameInput").value;
            const result = document.getElementById("result");

            if (name.trim() === "") {
                result.textContent = "Введите имя";
                return;
            }

            try {
                const response = await fetch("/hello", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name
                    })
                });

                const data = await response.json();

                result.textContent = data.message;
            } catch (error) {
                result.textContent = "Ошибка соединения";
            }
        }

        async function sendSummary() {
            const text = summaryInput.value;
            const summaryResult = document.getElementById("summaryResult");
            const debugTail = document.getElementById("debugTail");
            const selectedLimitValue = Number(limitValue.value);
            const sourceLimitMax = getCurrentLimitMax();
            const selectedMode = document.querySelector('input[name="summaryMode"]:checked').value;

            if (text.trim() === "") {
                summaryResult.textContent = "Введите текст";
                updateOutputCounter(summaryResult.textContent);
                return;
            }

            if (!Number.isInteger(selectedLimitValue) || selectedLimitValue <= 0) {
                summaryResult.textContent = "Введите корректный лимит";
                updateOutputCounter(summaryResult.textContent);
                return;
            }

            if (selectedLimitValue < 1) {
                summaryResult.textContent = "Минимум 1 слово";
                updateOutputCounter(summaryResult.textContent);
                return;
            }

            if (selectedLimitValue > sourceLimitMax) {
                summaryResult.textContent = "Лимит больше количества слов в тексте";
                updateOutputCounter(summaryResult.textContent);
                return;
            }

            setSummaryLoading(true);
            summaryResult.textContent = "";
            debugTail.textContent = "";
            updateOutputCounter("");

            try {
                const response = await fetch("/summarize", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: text,
                        limit_value: selectedLimitValue,
                        mode: selectedMode
                    })
                });

                const data = await response.json();
                const resultText = data.result || data.detail || "Не удалось получить результат";
                const debugReasonText = data.debug_reason === "too_many"
                    ? "слов было много"
                    : "слов было мало";
                const debugLabel = data.debug_reason === "too_many"
                    ? "Фрагмент для проверки"
                    : "Контекст для продолжения";

                summaryResult.innerHTML = renderMarkdown(resultText);
                debugTail.textContent = data.debug_tail
                    ? `${debugLabel} (${debugReasonText}): ${data.debug_tail}`
                    : "";
                updateOutputCounter(resultText);
            } catch (error) {
                summaryResult.textContent = "Ошибка соединения";
                debugTail.textContent = "";
                updateOutputCounter(summaryResult.textContent);
            } finally {
                setSummaryLoading(false);
            }
        }

        updateInputStats();
    </script>

</body>
</html>
