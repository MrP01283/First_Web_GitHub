<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>First Web App</title>
</head>
<body>

    <h1>Приветствие</h1>

    <input id="nameInput" type="text" placeholder="Введите имя">
    <button onclick="sendName()">Отправить</button>

    <p id="result"></p>

    <h1>Краткое содержание</h1>

    <textarea id="summaryInput" rows="8" cols="60" placeholder="Введите текст"></textarea>
    <br>
    <button onclick="sendSummary()">Сократить</button>

    <p id="summaryResult"></p>

    <script>
        async function sendName() {
            const name = document.getElementById("nameInput").value;
            const result = document.getElementById("result");

            if (name.trim() === "") {
                result.textContent = "Введите имя";
                return;
            }

            try {
                const response = await fetch("http://127.0.0.1:8000/hello", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: name
                    })
                });

                const data = await response.json();

                result.textContent = data.message;
            } catch (error) {
                result.textContent = "Ошибка соединения";
            }
        }

        async function sendSummary() {
            const text = document.getElementById("summaryInput").value;
            const summaryResult = document.getElementById("summaryResult");

            try {
                const response = await fetch("http://127.0.0.1:8000/summarize", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        text: text
                    })
                });

                const data = await response.json();

                summaryResult.textContent = data.result;
            } catch (error) {
                summaryResult.textContent = "Ошибка соединения";
            }
        }
    </script>

</body>
</html>
